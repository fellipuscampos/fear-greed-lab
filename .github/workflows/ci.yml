name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Apply migrations (fresh SQLite db for the build)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
